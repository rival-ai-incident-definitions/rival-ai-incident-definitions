claims:
  few_certain:
    quotes:
    - exact: In practice few adverse reactions are ‘certain’ or ‘unlikely’; most are somewhere in between
        these extremes, i.e. ‘possible’ or ‘probable’
  cannot_change:
    quotes:
    - exact: Change uncertainty into certainty
  possible_criterion:
    quotes:
    - exact: Could also be explained by disease or other drugs
  conditional:
    quotes:
    - exact: is of a preliminary nature and is appropriate when, for a proper assessment, there is more
        data needed and such data are being sought, or are already under examination
  unclassifiable:
    quotes:
    - exact: when the information in a report is incomplete or contradictory and cannot be complemented
        or verified, the verdict is ‘Unclassifiable’

claims:
  catastrophic_def:
    quotes:
    - exact: means a major uncontrolled emission, fire, or explosion, involving one or more highly hazardous
        chemicals, that presents serious danger to employees in the workplace
  investigate_each:
    quotes:
    - exact: The employer shall investigate each incident which resulted in, or could reasonably have
        resulted in a catastrophic release of highly hazardous chemical in the workplace.
  report_factors:
    quotes:
    - exact: The factors that contributed to the incident
  near_misses:
    quotes:
    - exact: Some of the events are sometimes referred to as “near misses,” meaning that a serious consequence
        did not occur, but could have.
  not_blame:
    quotes:
    - exact: The focus of the investigation should be to obtain facts, and not to place blame.
  appendix_c_nonmandatory:
    quotes:
    - exact: This appendix serves as a nonmandatory guideline

claims:
  q-cset-1:
    statement: lines 106–109
    verified: true
    quotes:
    - exact: "An AI Tangible Harm Event occurs when 1) a potentially identifiable, specific entity 2) experiences an event that causes tangible harm (injury, loss, or damage) which 3) can be directly linked to a consequence of 4) an AI’s behavior."
  q-cset-2:
    statement: lines 147–154
    verified: true
    quotes:
    - exact: "A Special Interest Intangible AI Harm occurs when 1) a characterizable class or subgroup of entities 2) experiences or has a risk of experiencing a designated intangible harm that 3) can be directly linked to the consequences of 4) an AI’s behavior. In reference to #2 above, CSET has designated three categories of intangible harm: a) harm to civil liberties, civil rights, human rights, or democratic norms, b) detrimental content (misinformation, hate-speech, etc), and c) differential treatment based upon a protected characteristic."
  q-cset-3:
    statement: lines 46–48
    verified: true
    quotes:
    - exact: "CSET is not distinguishing or defining similar levels (event, near-miss, and issue) for intangible harms."
  q-cset-4:
    statement: lines 31–34
    verified: true
    quotes:
    - exact: "The impetus behind the update was to (1) decrease inter-annotator variability for AI incident harm annotation, (2) better distinguish between tangible harm events, near-misses, issues, and (3) identify three specific, special-interest intangible harm types."
  q-cset-5:
    statement: lines 418–421
    verified: true
    quotes:
    - exact: "err on the side of classifying the account as an issue or the lowest clearly known level of harm category. We should have a high degree of confidence that harm did indeed involve harm tied to an entity and an AI system."
  q-cset-6:
    statement: lines 888–891
    verified: true
    quotes:
    - exact: "The AI system doesn’t need to be the only factor, or even the major factor, in causing the harm. But it should at least be a “but-for” cause - that is, if the AI system hadn’t acted in the way it did, the specific harm would not have occurred."
  q-cset-7:
    statement: lines 893–894
    verified: true
    quotes:
    - exact: "Harm would have occurred had it not been for randomness , luck, or atypical intervention that prevented the harm."
  q-cset-8:
    statement: lines 897–898
    verified: true
    quotes:
    - exact: "Harm could not have nearly occurred but it could plausibly occur in the future."
  q-cset-9:
    statement: lines 904–905
    verified: true
    quotes:
    - exact: "the general public is not an identifiable specific entity"
  q-cset-10:
